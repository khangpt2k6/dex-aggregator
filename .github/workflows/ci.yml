name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The router latency budget is a build gate, not a README claim.
      # This step fails the build if p99 regresses past 10ms.
      #
      # It must run without -race. The detector instruments every memory access
      # and inflates p99 by more than tenfold, so the budget is only meaningful
      # against an uninstrumented binary. The test skips its own assertion when
      # built with -race, which is why this separate step is the one that counts.
      - name: router latency gate
        run: go test -count=1 ./internal/graph/ -run TestRouterLatencyBudget -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install
        run: npm ci || npm install

      - name: typecheck and build
        run: npm run build
