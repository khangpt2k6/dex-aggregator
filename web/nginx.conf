server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API and the price stream live on the aggregator, not here.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://api:8080;
    }

    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Without these the upgrade is downgraded to a plain request and the
        # price chart silently never receives a tick.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
    }
}
